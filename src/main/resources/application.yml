server:
  port: 8888

spring:
  application:
    name: config-server

  security:
    user:
      name: configuration
      password: config@123

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Pratik-Bhange/BankingApp.git
          default-label: master
          clone-on-start: true
          timeout: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics